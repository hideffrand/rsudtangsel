services:
  db:
    image: postgres:16-alpine
    container_name: rsudtangsel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rsudtangsel}
      POSTGRES_USER: ${POSTGRES_USER:-rsudtangsel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsudtangsel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsudtangsel} -d ${POSTGRES_DB:-rsudtangsel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rsudtangsel-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # URL internal menuju service db (host port tidak relevan di dalam network)
      DATABASE_URL: postgres://${POSTGRES_USER:-rsudtangsel}:${POSTGRES_PASSWORD:-rsudtangsel}@db:5432/${POSTGRES_DB:-rsudtangsel}?sslmode=disable
      # Go server mem-proxy OCR ke microservice ini
      OCR_SERVICE_URL: http://ocr:8000
      SERVER_PORT: "8080"
      # Auth — ganti JWT_SECRET dengan secret 256-bit yang kuat di produksi!
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-3600}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-604800}
      BCRYPT_COST: ${BCRYPT_COST:-10}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # URL yang DIKENALI BROWSER (host port server), bukan nama service compose.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: rsudtangsel-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_started

  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: rsudtangsel-ocr
    restart: unless-stopped
    ports:
      - "${OCR_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - REC_LANG_TYPE=en

volumes:
  postgres-data:
