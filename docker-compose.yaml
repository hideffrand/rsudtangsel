services:
  db:
    image: postgres:16-alpine
    container_name: rsudtangsel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rsudtangsel}
      POSTGRES_USER: ${POSTGRES_USER:-rsudtangsel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsudtangsel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsudtangsel} -d ${POSTGRES_DB:-rsudtangsel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rsudtangsel-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount source code untuk hot-reload
      - ./web:/app
      # Isolate node_modules di dalam container (jangan di-override host)
      - web-node-modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: rsudtangsel-ocr
    restart: unless-stopped
    ports:
      - "${OCR_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - REC_LANG_TYPE=en

volumes:
  postgres-data:
  web-node-modules:
